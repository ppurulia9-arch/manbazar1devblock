<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - Manbazar-I Development Block</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      color: #1769d1;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 25px;
      border: none;
      border-radius: 7px;
      background: #1769d1;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #0d55ad;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Reset Password</h1>

    <div class="subtitle">
      Manbazar-I Development Block
    </div>

    <label for="password">
      New Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter new password"
      minlength="6"
    >

    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
      minlength="6"
    >

    <button onclick="updatePassword()">
      Update Password
    </button>

    <div id="message"></div>

  </div>


<script>

  const SUPABASE_URL =
    "https://nqfcoofeqsesenmttcwr.supabase.co";

  // এখানে আপনার আগের Publishable Key বসাবেন
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_14PngswpauPUWSKHQIcTgg_uvCFfaE2";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  async function updatePassword() {

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const message =
      document.getElementById("message");

    message.className = "";
    message.textContent = "";


    if (!password || !confirmPassword) {

      message.className = "error";

      message.textContent =
        "Please enter both password fields.";

      return;
    }


    if (password.length < 6) {

      message.className = "error";

      message.textContent =
        "Password must be at least 6 characters.";

      return;
    }


    if (password !== confirmPassword) {

      message.className = "error";

      message.textContent =
        "Passwords do not match.";

      return;
    }


    const { error } =
      await supabaseClient.auth.updateUser({
        password: password
      });


    if (error) {

      message.className = "error";

      message.textContent = error.message;

      return;
    }


    message.className = "success";

    message.textContent =
      "Password updated successfully!";


    setTimeout(function() {

      window.location.href = "login.html";

    }, 2000);

  }

</script>

</body>
</html>
