<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Content Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#eef3f8;color:#172033}.top{background:#083f88;color:#fff;padding:17px 25px;display:flex;justify-content:space-between}.top button{background:#e11;color:#fff;border:0;padding:9px 16px;border-radius:7px}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}.tabs{background:#fff;padding:12px;border-radius:12px;display:flex;gap:7px;flex-wrap:wrap}.tab{border:0;padding:10px 13px;border-radius:7px;font-weight:700;color:#12427e;cursor:pointer}.tab.active{background:#0b4a9a;color:white}.panel{display:none;background:#fff;margin-top:15px;padding:20px;border-radius:12px;box-shadow:0 3px 14px #0001}.panel.active{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-weight:700;display:block;margin-bottom:5px}input,textarea{width:100%;padding:10px;border:1px solid #ccd5e1;border-radius:7px;box-sizing:border-box}textarea{min-height:90px}.primary,.secondary,.edit,.del{border:0;padding:10px 14px;border-radius:7px;font-weight:700;cursor:pointer}.primary{background:#087f3f;color:white}.secondary{background:#e7edf4}.edit{background:#e7a300;color:white}.del{background:#b00020;color:white}.actions{margin:14px 0;display:flex;gap:8px}.item{border:1px solid #e1e6ed;border-radius:9px;padding:13px;margin:9px 0;display:flex;justify-content:space-between;gap:12px}.item h3{margin:0 0 5px;color:#17447e}.item p{margin:4px 0;color:#5d6878;white-space:pre-wrap}.msg{display:none;padding:10px;border-radius:7px;margin:8px 0}.ok{display:block;background:#dcfce7;color:#166534}.bad{display:block;background:#fee2e2;color:#991b1b}.preview{width:120px;height:80px;object-fit:cover;border-radius:6px}@media(max-width:700px){.form{grid-template-columns:1fr}.full{grid-column:auto}.item{flex-direction:column}}
</style></head><body>
<div class="top">
  <b>Manbazar-I Development Block — Content Manager</b>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
    <a href="dashboard.html" style="background:#fff;color:#083f88;text-decoration:none;border:0;padding:9px 16px;border-radius:7px;font-weight:700;display:inline-block">📊 Dashboard</a>
    <a href="../index.html" style="background:#fff;color:#083f88;text-decoration:none;border:0;padding:9px 16px;border-radius:7px;font-weight:700;display:inline-block">🏠 Home Page</a>
    <button id="logout">Logout</button>
  </div>
</div>
<div class="wrap"><div class="tabs">
<button class="tab active" data-p="notices">🔔 Notices</button><button class="tab" data-p="schemes">📋 Schemes</button><button class="tab" data-p="development">📈 Development</button><button class="tab" data-p="downloads">⬇️ Downloads</button><button class="tab" data-p="gallery">🖼️ Gallery</button><button class="tab" data-p="contacts">☎️ Contact</button>
</div>
<section id="notices" class="panel active"><h2>🔔 Notices</h2><div class="form"><div><label>Title</label><input id="nTitle"></div><div><label>Date</label><input id="nDate" type="date"></div><div class="full"><label>Description</label><textarea id="nDesc"></textarea></div><div><label>PDF</label><input id="nFile" type="file" accept=".pdf,application/pdf"></div></div><div class="actions"><button class="primary" onclick="saveNotice()">Save Notice</button><button class="secondary" onclick="clearNotice()">Clear</button></div><div id="nMsg" class="msg"></div><div id="noticeList"></div></section>
<section id="schemes" class="panel"><h2>📋 Schemes</h2><input type="hidden" id="sId"><div class="form"><div><label>Title</label><input id="sTitle"></div><div><label>Apply/View Link</label><input id="sLink" type="url" placeholder="https://example.gov.in/..."></div><div class="full"><label>Description</label><textarea id="sDesc"></textarea></div></div><div class="actions"><button class="primary" onclick="saveScheme()">Save Scheme</button><button class="secondary" onclick="clearScheme()">Clear</button></div><div id="sMsg" class="msg"></div><div id="schemeList"></div></section>
<section id="development" class="panel"><h2>📈 Development Information</h2><input type="hidden" id="dId"><div class="form"><div><label>Title</label><input id="dTitle"></div><div><label>Image URL</label><input id="dImage"></div><div class="full"><label>Information</label><textarea id="dDesc"></textarea></div></div><div class="actions"><button class="primary" onclick="saveDev()">Save Information</button><button class="secondary" onclick="clearDev()">Clear</button></div><div id="dMsg" class="msg"></div><div id="devList"></div></section>
<section id="downloads" class="panel"><h2>⬇️ Downloads</h2><input type="hidden" id="dlId"><div class="form"><div><label>Title</label><input id="dlTitle"></div><div><label>Description</label><input id="dlDesc"></div><div><label>File</label><input id="dlFile" type="file"></div></div><div class="actions"><button class="primary" onclick="saveDownload()">Upload / Save</button><button class="secondary" onclick="clearDownload()">Clear</button></div><div id="dlMsg" class="msg"></div><div id="dlList"></div></section>
<section id="gallery" class="panel"><h2>🖼️ Gallery</h2><input type="hidden" id="gId"><div class="form"><div><label>Photo Title</label><input id="gTitle"></div><div><label>Caption</label><input id="gCaption"></div><div><label>Photo</label><input id="gFile" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"></div></div><div class="actions"><button class="primary" onclick="saveGallery()">Upload / Save</button><button class="secondary" onclick="clearGallery()">Clear</button></div><div id="gMsg" class="msg"></div><div id="gList"></div></section>
<section id="contacts" class="panel"><h2>☎️ Contact Information</h2><input type="hidden" id="cId"><div class="form"><div><label>Department / Office</label><input id="cDept"></div><div><label>Contact Person</label><input id="cName"></div><div><label>Designation</label><input id="cDes"></div><div><label>Phone</label><input id="cPhone"></div><div><label>Email</label><input id="cEmail"></div><div><label>Address</label><input id="cAddress"></div></div><div class="actions"><button class="primary" onclick="saveContact()">Save Contact</button><button class="secondary" onclick="clearContact()">Clear</button></div><div id="cMsg" class="msg"></div><div id="cList"></div></section>
</div>
<script>
const sb=supabase.createClient("https://nqfcoofeqsesenmttcwr.supabase.co","sb_publishable_14PngswpauPUWSKHQIcTgg_uvCFfaE2");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function say(id,t,ok=true){$(id).textContent=t;$(id).className="msg "+(ok?"ok":"bad");setTimeout(()=>$(id).style.display="none",3000)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.p).classList.add("active")});
async function guard(){let r=await sb.auth.getUser();if(!r.data.user){location.href="login.html";return false}return true}

let notices=[],schemes=[],devs=[],dls=[],gals=[],cons=[];
async function loadNotices(){let r=await sb.from("notices").select("*").order("notice_date",{ascending:false});if(r.error)return say("nMsg",r.error.message,false);notices=r.data||[];$("noticeList").innerHTML=notices.map(n=>`<div class=item><div><h3>${esc(n.title)}</h3><p>${esc(n.description)}</p><p>${esc(n.notice_date||"")} ${n.file_url?"📄 PDF":""}</p></div><div><button class=edit onclick="editNotice('${n.id}')">Edit</button> <button class=del onclick="delNotice('${n.id}')">Delete</button></div></div>`).join("")||"<p>No notices.</p>"}
function clearNotice(){$("nTitle").value="";$("nDate").value="";$("nDesc").value="";$("nFile").value="";window.nid=null}
function editNotice(id){let n=notices.find(x=>x.id==id);window.nid=id;$("nTitle").value=n.title;$("nDate").value=n.notice_date||"";$("nDesc").value=n.description||""}
async function saveNotice(){let title=$("nTitle").value.trim();if(!title)return say("nMsg","Title required",false);let p={title,description:$("nDesc").value.trim(),notice_date:$("nDate").value||null};let f=$("nFile").files[0];if(f){let path="admin-notices/"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");let u=await sb.storage.from("notices").upload(path,f,{upsert:true,contentType:f.type});if(u.error)return say("nMsg",u.error.message,false);p.file_url=sb.storage.from("notices").getPublicUrl(path).data.publicUrl}let r=window.nid?await sb.from("notices").update(p).eq("id",window.nid):await sb.from("notices").insert(p);if(r.error)return say("nMsg",r.error.message,false);say("nMsg","Notice saved");clearNotice();loadNotices()}
async function delNotice(id){if(!confirm("Delete notice?"))return;let r=await sb.from("notices").delete().eq("id",id);if(r.error)return say("nMsg",r.error.message,false);loadNotices()}

async function loadSchemes(){let r=await sb.from("schemes").select("*").order("created_at",{ascending:false});if(r.error)return say("sMsg",r.error.message,false);schemes=r.data||[];$("schemeList").innerHTML=schemes.map(x=>`<div class=item><div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></div><div><button class=edit onclick="editScheme('${x.id}')">Edit</button> <button class=del onclick="delScheme('${x.id}')">Delete</button></div></div>`).join("")||"<p>No schemes.</p>"}
function clearScheme(){$("sId").value="";$("sTitle").value="";$("sDesc").value="";$("sLink").value=""}
function editScheme(id){let x=schemes.find(y=>y.id==id);$("sId").value=id;$("sTitle").value=x.title;$("sDesc").value=x.description||"";$("sLink").value=x.link_url||""}
function normalizeSchemeUrl(value){
  const v=(value||"").trim();
  if(!v)return null;
  try{
    const u=new URL(v);
    if(!["http:","https:"].includes(u.protocol)) throw new Error();
    return u.href;
  }catch(e){
    throw new Error("Please enter a valid Apply/View Link starting with https://");
  }
}
async function saveScheme(){
  let title=$("sTitle").value.trim();
  if(!title)return say("sMsg","Title required",false);

  let link=null;
  try{
    link=normalizeSchemeUrl($("sLink").value);
  }catch(e){
    return say("sMsg",e.message,false);
  }

  const p={
    title:title,
    description:$("sDesc").value.trim(),
    link_url:link
  };

  let r=$("sId").value
    ?await sb.from("schemes").update(p).eq("id",$("sId").value)
    :await sb.from("schemes").insert(p);

  if(r.error){
    console.error("Scheme save error:",r.error);
    return say("sMsg",r.error.message||"Scheme save failed",false);
  }

  say("sMsg","Scheme saved successfully");
  clearScheme();
  await loadSchemes();
}
async function delScheme(id){if(!confirm("Delete scheme?"))return;let r=await sb.from("schemes").delete().eq("id",id);if(r.error)return say("sMsg",r.error.message,false);loadSchemes()}

async function loadDev(){let r=await sb.from("development_content").select("*").order("created_at",{ascending:false});if(r.error)return say("dMsg",r.error.message,false);devs=r.data||[];$("devList").innerHTML=devs.map(x=>`<div class=item><div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></div><div><button class=edit onclick="editDev('${x.id}')">Edit</button> <button class=del onclick="delDev('${x.id}')">Delete</button></div></div>`).join("")||"<p>No development information.</p>"}
function clearDev(){$("dId").value="";$("dTitle").value="";$("dDesc").value="";$("dImage").value=""}
function editDev(id){let x=devs.find(y=>y.id==id);$("dId").value=id;$("dTitle").value=x.title;$("dDesc").value=x.description||"";$("dImage").value=x.image_url||""}
async function saveDev(){let p={title:$("dTitle").value.trim(),description:$("dDesc").value.trim(),image_url:$("dImage").value.trim()||null};if(!p.title)return say("dMsg","Title required",false);let r=$("dId").value?await sb.from("development_content").update(p).eq("id",$("dId").value):await sb.from("development_content").insert(p);if(r.error)return say("dMsg",r.error.message,false);say("dMsg","Development information saved");clearDev();loadDev()}
async function delDev(id){if(!confirm("Delete development information?"))return;let r=await sb.from("development_content").delete().eq("id",id);if(r.error)return say("dMsg",r.error.message,false);loadDev()}

async function loadDls(){let r=await sb.from("downloads").select("*").order("created_at",{ascending:false});if(r.error)return say("dlMsg",r.error.message,false);dls=r.data||[];$("dlList").innerHTML=dls.map(x=>`<div class=item><div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></div><div><button class=edit onclick="editDl('${x.id}')">Edit</button> <button class=del onclick="delDl('${x.id}')">Delete</button></div></div>`).join("")||"<p>No downloads.</p>"}
function clearDownload(){$("dlId").value="";$("dlTitle").value="";$("dlDesc").value="";$("dlFile").value=""}
function editDl(id){let x=dls.find(y=>y.id==id);$("dlId").value=id;$("dlTitle").value=x.title;$("dlDesc").value=x.description||""}
async function saveDownload(){let title=$("dlTitle").value.trim(),f=$("dlFile").files[0],old=dls.find(x=>x.id==$("dlId").value)?.file_path;if(!title)return say("dlMsg","Title required",false);let path=old;if(f){let p=""+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");let u=await sb.storage.from("site-downloads").upload(p,f,{upsert:true,contentType:f.type||"application/octet-stream"});if(u.error)return say("dlMsg",u.error.message,false);path=p}if(!path)return say("dlMsg","Select a file",false);let data={title,description:$("dlDesc").value.trim(),file_path:path};let r=$("dlId").value?await sb.from("downloads").update(data).eq("id",$("dlId").value):await sb.from("downloads").insert(data);if(r.error)return say("dlMsg",r.error.message,false);say("dlMsg","Download saved");clearDownload();loadDls()}
async function delDl(id){if(!confirm("Delete download?"))return;let x=dls.find(y=>y.id==id);if(x?.file_path)await sb.storage.from("site-downloads").remove([x.file_path]);let r=await sb.from("downloads").delete().eq("id",id);if(r.error)return say("dlMsg",r.error.message,false);loadDls()}

async function loadGals(){let r=await sb.from("gallery_photos").select("*").order("created_at",{ascending:false});if(r.error)return say("gMsg",r.error.message,false);gals=r.data||[];$("gList").innerHTML=gals.map(x=>`<div class=item><div><img class=preview src="${sb.storage.from("site-gallery").getPublicUrl(x.image_path).data.publicUrl}"><h3>${esc(x.title||"Photo")}</h3><p>${esc(x.caption||"")}</p></div><div><button class=edit onclick="editGal('${x.id}')">Edit</button> <button class=del onclick="delGal('${x.id}')">Delete</button></div></div>`).join("")||"<p>No photos.</p>"}
function clearGallery(){$("gId").value="";$("gTitle").value="";$("gCaption").value="";$("gFile").value=""}
function editGal(id){let x=gals.find(y=>y.id==id);$("gId").value=id;$("gTitle").value=x.title||"";$("gCaption").value=x.caption||""}
async function saveGallery(){let f=$("gFile").files[0],old=gals.find(x=>x.id==$("gId").value)?.image_path;if(!f&&!old)return say("gMsg","Select a photo",false);let path=old;if(f){let p=Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");let u=await sb.storage.from("site-gallery").upload(p,f,{upsert:true,contentType:f.type});if(u.error)return say("gMsg",u.error.message,false);path=p}let data={title:$("gTitle").value.trim()||null,caption:$("gCaption").value.trim()||null,image_path:path};let r=$("gId").value?await sb.from("gallery_photos").update(data).eq("id",$("gId").value):await sb.from("gallery_photos").insert(data);if(r.error)return say("gMsg",r.error.message,false);say("gMsg","Photo saved");clearGallery();loadGals()}
async function delGal(id){if(!confirm("Delete photo?"))return;let x=gals.find(y=>y.id==id);if(x?.image_path)await sb.storage.from("site-gallery").remove([x.image_path]);let r=await sb.from("gallery_photos").delete().eq("id",id);if(r.error)return say("gMsg",r.error.message,false);loadGals()}

async function loadCons(){let r=await sb.from("contacts").select("*").order("created_at",{ascending:false});if(r.error)return say("cMsg",r.error.message,false);cons=r.data||[];$("cList").innerHTML=cons.map(x=>`<div class=item><div><h3>${esc(x.department)}</h3><p>${esc(x.officer_name||"")} ${esc(x.designation||"")}</p><p>${esc(x.phone||"")} ${esc(x.email||"")}</p><p>${esc(x.address||"")}</p></div><div><button class=edit onclick="editCon('${x.id}')">Edit</button> <button class=del onclick="delCon('${x.id}')">Delete</button></div></div>`).join("")||"<p>No contacts.</p>"}
function clearContact(){$("cId").value="";["cDept","cName","cDes","cPhone","cEmail","cAddress"].forEach(id=>$(id).value="")}
function editCon(id){let x=cons.find(y=>y.id==id);$("cId").value=id;$("cDept").value=x.department;$("cName").value=x.officer_name||"";$("cDes").value=x.designation||"";$("cPhone").value=x.phone||"";$("cEmail").value=x.email||"";$("cAddress").value=x.address||""}
async function saveContact(){let p={department:$("cDept").value.trim(),officer_name:$("cName").value.trim()||null,designation:$("cDes").value.trim()||null,phone:$("cPhone").value.trim()||null,email:$("cEmail").value.trim()||null,address:$("cAddress").value.trim()||null};if(!p.department)return say("cMsg","Department required",false);let r=$("cId").value?await sb.from("contacts").update(p).eq("id",$("cId").value):await sb.from("contacts").insert(p);if(r.error)return say("cMsg",r.error.message,false);say("cMsg","Contact saved");clearContact();loadCons()}
async function delCon(id){if(!confirm("Delete contact?"))return;let r=await sb.from("contacts").delete().eq("id",id);if(r.error)return say("cMsg",r.error.message,false);loadCons()}

$("logout").onclick=async()=>{await sb.auth.signOut();location.href="login.html"};
(async()=>{if(await guard())await Promise.all([loadNotices(),loadSchemes(),loadDev(),loadDls(),loadGals(),loadCons()])})();
</script></body></html>
