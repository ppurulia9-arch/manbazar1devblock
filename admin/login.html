<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Manbazar-I Development Block</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 90%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      color: #1769d1;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #1769d1;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #0d55ad;
    }

    .forgot {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #1769d1;
      cursor: pointer;
      text-decoration: underline;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Admin Login</h1>
    <div class="subtitle">Manbazar-I Development Block</div>

    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter password"
      required
    >

    <button onclick="login()">Login</button>

    <span class="forgot" onclick="forgotPassword()">
      Forgot Password?
    </span>

    <div id="message"></div>

  </div>

<script>

  // Supabase Project URL
  const SUPABASE_URL =
    "https://nqfcoofeqsesenmttcwr.supabase.co";

  // এখানে আপনার আগের Publishable Key-টি রাখুন
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_14PngswpauPUWSKHQIcTgg_uvCFfaE2";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // LOGIN
  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    message.className = "";
    message.textContent = "";

    if (!email || !password) {
      message.className = "error";
      message.textContent = "Email and password required.";
      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      message.className = "error";
      message.textContent = error.message;
      return;
    }

    if (data.session) {
      window.location.href = "dashboard.html";
    }
  }


  // FORGOT PASSWORD
  async function forgotPassword() {

    const email =
      document.getElementById("email").value.trim();

    const message =
      document.getElementById("message");

    message.className = "";
    message.textContent = "";

    if (!email) {
      message.className = "error";
      message.textContent =
        "Please enter your email address first.";
      return;
    }

    const redirectUrl =
      window.location.origin +
      window.location.pathname.replace(
        "login.html",
        "reset-password.html"
      );

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: redirectUrl
        }
      );

    if (error) {
      message.className = "error";
      message.textContent = error.message;
      return;
    }

    message.className = "success";
    message.textContent =
      "Password reset link has been sent to your email.";
  }

</script>

</body>
</html>
