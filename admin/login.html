<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Manbazar-I Dev Block</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #1e3a8a;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      background: #888;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #dc2626;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Admin Login</h1>

    <div class="subtitle">
      Manbazar-I Development Block
    </div>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message"></div>

  </div>

<script>
  const SUPABASE_URL = "https://nqfcoofeqsesenmttcwr.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_14PngswpauPUWSKHQIcTgg_uvCFfaE2";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const button = document.getElementById("loginButton");

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "";
    button.disabled = true;
    button.textContent = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.textContent = error.message;

      button.disabled = false;
      button.textContent = "Login";

      return;
    }

    if (data.session) {

      message.style.color = "green";
      message.textContent = "Login successful...";

      window.location.href = "dashboard.html";
    }

  });
</script>

</body>
</html>
