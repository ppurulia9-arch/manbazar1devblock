<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Manbazar-I Dev Block</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #1e3a8a;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #172554;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: red;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Admin Login</h1>

    <div class="subtitle">
      Manbazar-I Development Block
    </div>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      document.getElementById("message").innerText =
        "Supabase connection will be added in the next step.";
    });
  </script>

</body>
</html>
