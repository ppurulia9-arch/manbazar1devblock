<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - Manbazar-I Development Block</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 430px;
      background: white;
      padding: 35px 28px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #1976d2;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #2196f3;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1976d2;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Reset Password</h1>

    <div class="subtitle">
      Manbazar-I Development Block
    </div>

    <form id="resetForm">

      <label for="password">
        New Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        required
        minlength="6"
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        required
        minlength="6"
      >

      <button type="submit">
        Update Password
      </button>

    </form>

    <div id="message"></div>

  </div>


<script>

const SUPABASE_URL =
  "https://nqfcoofeqsesenmttcwr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_14PngswpauPUWSKHQIcTgg_uvCFfaE2";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const form =
  document.getElementById("resetForm");

const message =
  document.getElementById("message");


// ==========================================
// PASSWORD RECOVERY SESSION
// ==========================================

let recoverySession = null;


// Listen for Supabase password recovery
supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    console.log("Auth Event:", event);

    if (event === "PASSWORD_RECOVERY") {

      recoverySession = session;

      message.className = "success";

      message.textContent =
        "Recovery session verified. Enter your new password.";

    }

  }
);


// Check existing session
(async function() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {

    recoverySession = session;

  }

})();


// ==========================================
// UPDATE PASSWORD
// ==========================================

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

      message.className = "error";

      message.textContent =
        "Passwords do not match.";

      return;

    }


    if (password.length < 6) {

      message.className = "error";

      message.textContent =
        "Password must be at least 6 characters.";

      return;

    }


    message.className = "";

    message.textContent =
      "Updating password...";


    const {
      data,
      error
    } = await supabaseClient.auth.updateUser({

      password: password

    });


    if (error) {

      message.className = "error";

      message.textContent =
        error.message;

      return;

    }


    message.className = "success";

    message.textContent =
      "Password updated successfully!";


    setTimeout(function() {

      window.location.href =
        "login.html";

    }, 2000);

  }
);

</script>
</body>
</html>
